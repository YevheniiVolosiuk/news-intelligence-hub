# Development overrides - auto-merged by `docker compose up`.
# Switches every app service to the `development` build target, bind-mounts source
# for hot reload, and publishes host ports for the reviewer and local tools.

services:
  backend:
    build:
      target: development
    command: ["npm", "run", "start:debug"]
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist               # keep container build output off the host bind mount
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    ports:
      - "${BACKEND_HOST_PORT:-3001}:3000"  # API:        http://localhost:3001/health
      - "9229:9229"                        # Node debugger (inspector)

  worker-pull:
    build:
      target: development
    command: ["npm", "run", "worker:pull:dev"]
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug

  worker-label:
    build:
      target: development
    command: ["npm", "run", "worker:label:dev"]
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug

  bull-board:
    build:
      target: development
    command: ["npm", "run", "board:dev"]
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    ports:
      - "${BULL_BOARD_HOST_PORT:-3002}:3001"  # Bull Board: http://localhost:3002 (basic auth)

  frontend:
    build:
      target: development
    command: ["npm", "run", "dev"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      BACKEND_INTERNAL_URL: http://backend:3000
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"    # App:        http://localhost:3000

  db:
    ports:
      - "${DB_PORT:-5432}:5432"               # For TablePlus / DBeaver / DataGrip

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"            # For redis-cli / RedisInsight
